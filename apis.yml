aid: lightsource
name: LightSource
description: 'LightSource is an AI-native direct materials procurement platform that
  connects engineering, procurement, and suppliers across the full sourcing lifecycle
  from concept to award. The product automates RFX creation and distribution, AI-assisted
  bid analysis, supplier collaboration and quote normalization across custom quote formats,
  and ongoing cost tracking, with more than 20,000 suppliers live on the network. It is
  sold to procurement and supply-chain teams in automotive, electronics, chemicals, medical
  devices, construction, and forest products, and the company reports sourcing cost reductions
  of 3-25% for customers including Time Manufacturing (Versalift), Arxada, BRP, and Canada
  Goose. LightSource is SOC 2 Type 2 attested and supports SSO and role-based access control.
  As of July 2026 the company publishes no public API, developer portal, or OpenAPI specification;
  its docs host is an end-user and supplier help center.'
